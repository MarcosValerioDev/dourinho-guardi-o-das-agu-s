<!DOCTYPE html>
<html lang="pt=br">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height,  initial-scale=1.0">
  <title>Saúde Bucal</title>
  <link rel="shortcut icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap" rel="stylesheet">
</head>

<body id="body"
  style="text-align: center; padding: 0; border: 0; margin: 0; width: 100%; height: 100%; overflow: hidden;">
  
  <div id="loading">
  
    <div class="loading-overlay">
      <div id="loading-progress">
      <p class="loadingTxt">Loading . . . </p>
      <p id="loadingText" class="loadingText">0 % </p>
      <div id="loadingOverlayBarra" class="loading-overlay-barra">
      </div>
      </div>
       <span id="spanText" style="user-select: none; text-emphasis: none; font-family: 'Roboto', sans-serif; padding: 6px; color:rgb(235, 227, 227); display: none;">Loading . . .</span>
    </div>
    
  </div>
  <canvas width="1280" height="720" id="unity-canvas" tabindex="-1" style="background: black"></canvas>
  <script>
    var body =  document.getElementById("body");
    var loadingOverlayBarra = document.getElementById("loadingOverlayBarra");
    var loadingText = document.getElementById("loadingText");
    var loadingProgress = document.getElementById("loading-progress");
    var loading = document.querySelector("#loading");
    var canvas = document.querySelector("#unity-canvas");
    var svgAnime = document.querySelector("#svgAnime");
    var spanText = document.querySelector("#spanText");
    var isMob = "no";

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Dourinho.loader.js";
    var config = {
      dataUrl: buildUrl + "/Dourinho.data.unityweb",
      frameworkUrl: buildUrl + "/Dourinho.framework.js.unityweb",
      codeUrl: buildUrl + "/Dourinho.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MarcosDev",
      productName: "Dourinho",
      productVersion: "0.1",
      devicePixelRatio: 1.5,
      matchWebGLToCanvasSize: true
    };

   function redimensionarCanvas() {
  // 1. Captura o elemento do canvas da Unity (coloque o ID correto do seu HTML)
  // const canvas = document.getElementById('unity-canvas') || document.getElementById('meuCanvas');
  if (!canvas) return;

  const proporcao = 16 / 9;
  
  // 2. Define a largura baseada na tela
  let largura = window.innerWidth;
  let altura = largura / proporcao;

  // 3. Se a altura calculada ultrapassar a tela, ajusta pela altura
  if (altura > window.innerHeight) {
    altura = window.innerHeight;
    largura = altura * proporcao;
  }

  // 4. Aplica o tamanho visual via CSS (O cálculo que você fez e está perfeito)
  canvas.style.width = largura + 'px';
  canvas.style.height = altura + 'px';
  
  // NOTA: Evite alterar canvas.width e canvas.height diretamente aqui para não 
  // forçar a Unity a reiniciar o contexto de renderização toda vez que a tela mudar.
}

// Executa ao carregar a página e sempre que a janela mudar de tamanho
window.addEventListener('resize', redimensionarCanvas);
window.addEventListener('load', redimensionarCanvas);

// window.addEventListener('resize', redimensionarCanvas);
// redimensionarCanvas(); // Executa ao carregar

// setInterval(()=>{
// redimensionarCanvas(); 
// console.log("Redimenciona")
// }, 1000)

    var fullscreenMode = 0;


    function FullScreen() {
      fullscreenMode = fullscreenMode == 0 ? 1 : 0;
      unityInstance.SetFullscreen(fullscreenMode);
    }

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      var meta = document.createElement('meta');
      isMob = "yes";
//      loadingProgress.style.display = "none";
      // spanText.style.display="block";
      // spanText.textContent = "Game disponível apenas para desktop.";
      meta.name = 'viewport';
      meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
      document.getElementsByTagName('head')[0].appendChild(meta);
      canvas.style.display = "none";
    //  canvas.style.height = "100vh";
    } else {
      canvas.style.display = "none";
      canvas.style.width = "100%";
    //  canvas.style.height = "100vh";
    }

    if (/iPad/i.test(navigator.userAgent)) {
      canvas.style.height = "90vh";
    }

    var unityInstance;
    var script = document.createElement("script");
    script.src = loaderUrl;
    //if (isMob == "no")
     script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        loadingOverlayBarra.style.width = (100 * progress).toFixed(2) + "%";
        loadingText.innerText = (100 * progress).toFixed(2) + " %";
      }).then((uinst) => {
        unityInstance = uinst;

        setTimeout(() => {
       //   unityInstance.SendMessage("MobileChange", "SetIsMob", isMob);
          canvas.style.display = "block";
          loading.style.display = "none";
          redimensionarCanvas();
        }, 3000);
        console.log("Loading finished...");
      }).catch((message) => {
        alert(message);
      });
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
